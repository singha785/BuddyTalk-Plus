version: "3.9"

# Local development environment — provides PostgreSQL for the API server.
# The API server and Expo app are run separately (see SELF_HOSTING.md).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buddytalk
      POSTGRES_PASSWORD: buddytalk
      POSTGRES_DB: buddytalk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddytalk -d buddytalk"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
